<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - IronFist Gym</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container-fluid {
            display: flex;
            width: 100%;
        }
        header {
            background: #800000;
            color: #fff;
            /* text-align: center; */
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .header-left {
            flex: 1;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        nav {
            width: 200px;
            background: #a52a2a;
            color: #fff;
            position: fixed;
            top: 50px;
            left: 0;
            height: calc(100vh - 50px);
            overflow-y: auto;
        }
        .burger-menu {
            display: none;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        nav ul li a {
            display: block;
            padding: 15px 20px;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #800000;
            box-sizing: border-box;
        }
        nav ul li a:hover, nav ul li a.active {
            background: #800000;
            font-weight: bold;
        }
        .content {
            margin-left: 200px;
            margin-top: 50px;
            padding: 20px;
            width: calc(100% - 200px);
            box-sizing: border-box;
        }
        .content section {
            margin-bottom: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            width: 100%;
        }
        textarea, input[type="text"], input[type="time"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        select {
            padding: 5px;
        }
        .item {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .item-actions {
            display: flex;
            gap: 10px;
        }
        .item-actions button {
            padding: 5px 10px;
            cursor: pointer;
        }
        .class-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }
        .schedule-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
            width: 100%;
        }
        .day-column {
            flex: 1;
            min-width: calc(25% - 10px);
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            background-color: #fff;
            margin-bottom: 10px;
        }
        .day-column h3 {
            text-align: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .session {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
            max-width: 500px;
            border-radius: 5px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        @media screen and (max-width: 768px) {
            .burger-menu {
                display: block;
                position: relative; /* change from fixed */
                top: auto;
                left: auto;
                background: transparent; /* remove background if not needed */
                color: white;
                padding: 0 10px 0 0; /* adjust spacing */
                cursor: pointer;
            }
            header {
                justify-content: space-between;
            }
            nav {
                width: 0;
                transition: width 0.3s;
                overflow: hidden;
            }
            nav.open {
                width: 200px;
            }
            .content {
                margin-left: 0;
                width: 100%;
            }

            .schedule-container {
                flex-direction: column;
            }

            .day-column {
                min-width: 100%;
            }

            .modal-content {
                width: 95% !important;
                margin: 20px auto !important;
                border-radius: 0;
            }

        }


         /* Sidebar links – default text colour */
        #sidebar .nav-link {
            color: #ffffff !important;    /* white */
        }

        /* Hover / focus state */
        #sidebar .nav-link:hover,
        #sidebar .nav-link:focus {
            color: #0d6efd !important;    /* Bootstrap-blue */
            background-color: transparent;/* keep the red background you already set */
        }

        /* Optional: keep the active item blue too */
        #sidebar .nav-link.active {
            color: #0d6efd !important;
            font-weight: bold;            /* you already had this */
        }

        #current-time {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    
    <header>
        <div class="burger-menu">☰</div>
        <div class="header-left">
            <h1 style="margin: 0; font-size: 24px;">Classes</h1>
        </div>
        <div class="header-right">
            <div id="current-time"></div>
            <select id="language-select" class="form-select">
                <option value="en">English</option>
                <option value="gr">Greek</option>
            </select>
        </div>
    </header>
    <div class="container-fluid">
        <nav id="sidebar">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="classes.html"><i class="bi bi-people"></i> Classes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html"><i class="bi bi-info-circle"></i> About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="pricing.html"><i class="bi bi-tag"></i> Pricing</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="users.html"><i class="bi bi-people"></i> Users</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="payments.html"><i class="bi bi-credit-card"></i> Payments</a>
                </li>
            </ul>
        </nav>
        <div class="content">
            <section>
                <h2><i class="bi bi-journal-text"></i> Manage Class Offerings</h2>
                <button type="button" class="btn btn-primary" onclick="openClassModal()"><i class="bi bi-plus"></i> Add Class</button>
                <div id="class-items">
                    <!-- Class items will be added here -->
                </div>
            </section>
            <section>
                <h2><i class="bi bi-calendar-week"></i> Manage Weekly Class Schedule</h2>
                <button type="button" class="btn btn-primary" onclick="openSessionModal()"><i class="bi bi-plus"></i> Add Session</button>
                <div class="schedule-container" id="schedule-container">
                    <!-- Schedule items will be added here -->
                </div>
            </section>
        </div>
    </div>

    <!-- The Modal for adding a class -->
    <div id="addClassModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeClassModal()">&times;</span>
            <h2><i class="bi bi-journal-plus"></i> Add Class</h2>
            <form id="add-class-form">
                <div class="mb-3">
                    <label for="class-title" class="form-label"><i class="bi bi-type-h1"></i> Title:</label>
                    <input type="text" class="form-control" id="class-title" name="class-title" placeholder="Enter class title" required>
                </div>
                <div class="mb-3">
                    <label for="class-description" class="form-label"><i class="bi bi-text-paragraph"></i> Description:</label>
                    <textarea class="form-control" id="class-description" name="class-description" placeholder="Enter class description" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="class-image" class="form-label"><i class="bi bi-image"></i> Image URL:</label>
                    <input type="text" class="form-control" id="class-image" name="class-image" placeholder="Enter image URL" required>
                </div>
                <button type="button" class="btn btn-primary" onclick="addClass()"><i class="bi bi-save"></i> Add Class</button>
            </form>
        </div>
    </div>

    <!-- The Modal for editing a class -->
    <div id="editClassModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeClassModal()">&times;</span>
            <h2><i class="bi bi-journal-text"></i> Edit Class</h2>
            <form id="edit-class-form">
                <div class="mb-3">
                    <label for="edit-class-title" class="form-label"><i class="bi bi-type-h1"></i> Title:</label>
                    <input type="text" class="form-control" id="edit-class-title" name="class-title" required>
                </div>
                <div class="mb-3">
                    <label for="edit-class-description" class="form-label"><i class="bi bi-text-paragraph"></i> Description:</label>
                    <textarea class="form-control" id="edit-class-description" name="class-description" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="edit-class-image" class="form-label"><i class="bi bi-image"></i> Image URL:</label>
                    <input type="text" class="form-control" id="edit-class-image" name="class-image" required>
                </div>
                <button type="button" class="btn btn-primary" onclick="saveEditedClass()"><i class="bi bi-save"></i> Save Changes</button>
            </form>
        </div>
    </div>

    <!-- The Modal for adding a session -->
    <div id="addSessionModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSessionModal()">&times;</span>
            <h2><i class="bi bi-calendar-plus"></i> Add Session</h2>
            <form id="add-session-form">
                <div class="mb-3">
                    <label for="session-day" class="form-label"><i class="bi bi-calendar-day"></i> Day:</label>
                    <select class="form-select" id="session-day" required>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="session-class" class="form-label"><i class="bi bi-journal-text"></i> Class:</label>
                    <input type="text" class="form-control" id="session-class" placeholder="Enter class name" required>
                </div>
                <div class="mb-3">
                    <label for="session-start-time" class="form-label"><i class="bi bi-clock"></i> Start Time:</label>
                    <input type="time" class="form-control" id="session-start-time" required>
                </div>
                <div class="mb-3">
                    <label for="session-end-time" class="form-label"><i class="bi bi-clock"></i> End Time:</label>
                    <input type="time" class="form-control" id="session-end-time" required>
                </div>
                <div class="mb-3">
                    <label for="session-capacity" class="form-label"><i class="bi bi-people-fill"></i> Capacity:</label>
                    <input type="number" class="form-control" id="session-capacity" placeholder="Enter capacity" required>
                </div>
                <button type="button" class="btn btn-primary" onclick="addSession()"><i class="bi bi-save"></i> Add Session</button>
            </form>
        </div>
    </div>

    <!-- The Modal for editing a session -->
    <div id="editSessionModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSessionModal()">&times;</span>
            <h2><i class="bi bi-calendar-event"></i> Edit Session</h2>
            <form id="edit-session-form">
                <div class="mb-3">
                    <label for="edit-session-day" class="form-label"><i class="bi bi-calendar-day"></i> Day:</label>
                    <select class="form-select" id="edit-session-day" required>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="edit-session-class" class="form-label"><i class="bi bi-journal-text"></i> Class:</label>
                    <input type="text" class="form-control" id="edit-session-class" required>
                </div>
                <div class="mb-3">
                    <label for="edit-session-start-time" class="form-label"><i class="bi bi-clock"></i> Start Time:</label>
                    <input type="time" class="form-control" id="edit-session-start-time" required>
                </div>
                <div class="mb-3">
                    <label for="edit-session-end-time" class="form-label"><i class="bi bi-clock"></i> End Time:</label>
                    <input type="time" class="form-control" id="edit-session-end-time" required>
                </div>
                <div class="mb-3">
                    <label for="edit-session-capacity" class="form-label"><i class="bi bi-people-fill"></i> Capacity:</label>
                    <input type="number" class="form-control" id="edit-session-capacity" required>
                </div>
                <button type="button" class="btn btn-primary" onclick="saveEditedSession()"><i class="bi bi-save"></i> Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.querySelector('.burger-menu').addEventListener('click', function() {
            var sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        });

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('current-time').textContent = timeString;
        }

        setInterval(updateTime, 1000);
        updateTime();

        document.getElementById('language-select').addEventListener('change', function() {
            const selectedLanguage = this.value;
            alert('Language changed to ' + selectedLanguage);
        });

        // Highlight the current nav item
        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll('nav ul li a');

            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });

        // Initialize with existing class offerings
        let classOfferings = [
            {
                title: "Judo",
                description: "Master throws, holds and groundwork in this traditional Japanese martial art.",
                image: "/templates/boxinggym/boxinggym1/assets/img/judo.jpg"
            },
            {
                title: "Kickboxing",
                description: "Combine punches and kicks in this high-intensity martial arts workout.",
                image: "/templates/boxinggym/boxinggym1/assets/img/kickboxing.jpg"
            },
            {
                title: "Boxing",
                description: "Learn fundamentals of boxing: stance, footwork, punches, defense and combos.",
                image: "/templates/boxinggym/boxinggym1/assets/img/boxing3.jpg"
            }
        ];

        // Initialize with existing schedule
        let weeklySchedule = {
            "Monday": [
                { class: "Judo", start_time: "13:15", end_time: "14:15", capacity: 9 },
                { class: "Boxing", start_time: "06:30", end_time: "07:30", capacity: 16 }
            ],
            "Tuesday": [],
            "Wednesday": [
                { class: "Kickboxing", start_time: "19:45", end_time: "21:15", capacity: 13 }
            ],
            "Thursday": [
                { class: "Boxing", start_time: "20:45", end_time: "21:45", capacity: 13 }
            ],
            "Friday": [
                { class: "Judo", start_time: "13:15", end_time: "14:45", capacity: 16 }
            ],
            "Saturday": [],
            "Sunday": []
        };

        let currentEditClassIndex = -1;
        let currentEditSession = { day: '', index: -1 };

        function openClassModal() {
            document.getElementById('addClassModal').style.display = 'block';
        }

        function closeClassModal() {
            document.getElementById('addClassModal').style.display = 'none';
            document.getElementById('editClassModal').style.display = 'none';
        }

        function openSessionModal() {
            document.getElementById('addSessionModal').style.display = 'block';
        }

        function closeSessionModal() {
            document.getElementById('addSessionModal').style.display = 'none';
            document.getElementById('editSessionModal').style.display = 'none';
        }

        function addClass() {
            const title = document.getElementById('class-title').value;
            const description = document.getElementById('class-description').value;
            const image = document.getElementById('class-image').value;

            if (title && description && image) {
                const classItem = { title, description, image };
                classOfferings.push(classItem);
                renderClasses();
                clearForm('add-class-form');
                closeClassModal();
            } else {
                alert('Please fill in all fields.');
            }
        }

        function renderClasses() {
            const classItemsContainer = document.getElementById('class-items');
            classItemsContainer.innerHTML = '';

            classOfferings.forEach((classItem, index) => {
                const classElement = document.createElement('div');
                classElement.className = 'item';
                classElement.innerHTML = `
                    <h3>${classItem.title}</h3>
                    <p>${classItem.description}</p>
                    <img src="${classItem.image}" alt="${classItem.title}" class="class-image">
                    <div class="item-actions">
                        <button class="btn btn-warning" onclick="openEditClassModal(${index})"><i class="bi bi-pencil"></i> Edit</button>
                        <button class="btn btn-danger" onclick="deleteClass(${index})"><i class="bi bi-trash"></i> Delete</button>
                    </div>
                `;
                classItemsContainer.appendChild(classElement);
            });
        }

        function openEditClassModal(index) {
            const classItem = classOfferings[index];
            document.getElementById('edit-class-title').value = classItem.title;
            document.getElementById('edit-class-description').value = classItem.description;
            document.getElementById('edit-class-image').value = classItem.image;
            currentEditClassIndex = index;
            document.getElementById('editClassModal').style.display = 'block';
        }

        function saveEditedClass() {
            const title = document.getElementById('edit-class-title').value;
            const description = document.getElementById('edit-class-description').value;
            const image = document.getElementById('edit-class-image').value;

            if (title && description && image) {
                classOfferings[currentEditClassIndex] = { title, description, image };
                renderClasses();
                closeClassModal();
            } else {
                alert('Please fill in all fields.');
            }
        }

        function deleteClass(index) {
            if (confirm("Are you sure you want to delete this class?")) {
                classOfferings.splice(index, 1);
                renderClasses();
            }
        }

        function addSession() {
            const day = document.getElementById('session-day').value;
            const className = document.getElementById('session-class').value;
            const startTime = document.getElementById('session-start-time').value;
            const endTime = document.getElementById('session-end-time').value;
            const capacity = document.getElementById('session-capacity').value;

            if (day && className && startTime && endTime && capacity) {
                const session = {
                    class: className,
                    start_time: startTime,
                    end_time: endTime,
                    capacity: parseInt(capacity)
                };

                weeklySchedule[day].push(session);
                renderSchedule();
                clearForm('add-session-form');
                closeSessionModal();
            } else {
                alert('Please fill in all fields.');
            }
        }

        function renderSchedule() {
            const scheduleContainer = document.getElementById('schedule-container');
            scheduleContainer.innerHTML = '';

            Object.entries(weeklySchedule).forEach(([day, sessions]) => {
                const dayColumn = document.createElement('div');
                dayColumn.className = 'day-column';
                dayColumn.innerHTML = `<h3>${day}</h3>`;

                sessions.forEach((session, sessionIndex) => {
                    const sessionElement = document.createElement('div');
                    sessionElement.className = 'session';
                    sessionElement.innerHTML = `
                        <p><strong>${session.class}</strong><br>${session.start_time} - ${session.end_time}<br>Capacity: ${session.capacity}</p>
                        <div class="item-actions">
                            <button class="btn btn-warning" onclick="openEditSessionModal('${day}', ${sessionIndex})"><i class="bi bi-pencil"></i> Edit</button>
                            <button class="btn btn-danger" onclick="deleteSession('${day}', ${sessionIndex})"><i class="bi bi-trash"></i> Delete</button>
                        </div>
                    `;
                    dayColumn.appendChild(sessionElement);
                });

                scheduleContainer.appendChild(dayColumn);
            });
        }

        function openEditSessionModal(day, sessionIndex) {
            const session = weeklySchedule[day][sessionIndex];
            document.getElementById('edit-session-day').value = day;
            document.getElementById('edit-session-class').value = session.class;
            document.getElementById('edit-session-start-time').value = session.start_time;
            document.getElementById('edit-session-end-time').value = session.end_time;
            document.getElementById('edit-session-capacity').value = session.capacity;
            currentEditSession = { day, index: sessionIndex };
            document.getElementById('editSessionModal').style.display = 'block';
        }

        function saveEditedSession() {
            const day = document.getElementById('edit-session-day').value;
            const className = document.getElementById('edit-session-class').value;
            const startTime = document.getElementById('edit-session-start-time').value;
            const endTime = document.getElementById('edit-session-end-time').value;
            const capacity = document.getElementById('edit-session-capacity').value;

            if (day && className && startTime && endTime && capacity) {
                const session = {
                    class: className,
                    start_time: startTime,
                    end_time: endTime,
                    capacity: parseInt(capacity)
                };

                weeklySchedule[currentEditSession.day][currentEditSession.index] = session;
                renderSchedule();
                closeSessionModal();
            } else {
                alert('Please fill in all fields.');
            }
        }

        function deleteSession(day, sessionIndex) {
            if (confirm("Are you sure you want to delete this session?")) {
                weeklySchedule[day].splice(sessionIndex, 1);
                renderSchedule();
            }
        }

        function clearForm(formId) {
            const form = document.getElementById(formId);
            form.reset();
        }


        // Close modal when pressing ESC key
        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById("addClassModal") || document.getElementById("editClassModal") || document.getElementById("addSessionModal") || document.getElementById("editSessionModal");            
            if (event.key === "Escape") {
                closeClassModal();
                closeSessionModal();

            }
        });



        // Render existing classes and schedule on page load
        renderClasses();
        renderSchedule();
    </script>
</body>
</html>
