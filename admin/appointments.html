<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Appointments</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container-fluid {
            display: flex;
            width: 100%;
        }
        header {
            background: #800000;
            color: #fff;
            /* text-align: center; */
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .header-left {
            flex: 1;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        nav {
            width: 200px;
            background: #a52a2a;
            color: #fff;
            position: fixed;
            top: 50px;
            left: 0;
            height: calc(100vh - 50px);
            overflow-y: auto;
            z-index: 1100; /* higher than header and content */
        }
        .burger-menu {
            display: none;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        nav ul li a {
            display: block;
            padding: 15px 20px;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #800000;
            box-sizing: border-box;
        }
        nav ul li a:hover, nav ul li a.active {
            background: #800000;
            font-weight: bold;
        }
        .content {
            margin-left: 200px;
            margin-top: 50px;
            padding: 20px;
            width: calc(100% - 200px);
            box-sizing: border-box;
        }
        .content section {
            margin-bottom: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
        }
        textarea, input[type="text"], input[type="datetime-local"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        select {
            padding: 5px;
        }
        .item {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .item-actions {
            display: flex;
            gap: 10px;
        }
        .item-actions button {
            padding: 5px 10px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .attended {
            background-color: #d4edda;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
            border-radius: 5px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        .card-container {
            display: none;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            background: #fff;
        }
        .card p {
            margin: 5px 0;
        }
        @media screen and (max-width: 768px) {
            .burger-menu {
                display: block;
                position: relative; /* change from fixed */
                top: auto;
                left: auto;
                background: transparent; /* remove background if not needed */
                color: white;
                padding: 0 10px 0 0; /* adjust spacing */
                cursor: pointer;
            }
            header {
                justify-content: space-between;
            }
            nav {
                width: 0;
                transition: width 0.3s;
                overflow: hidden;
            }
            nav.open {
                width: 200px;
            }
            .content {
                margin-left: 0;
                width: 100%;
            }
            table {
                display: none;
            }
            .card-container {
                display: block;
            }

            .modal-content {
                width: 95% !important;
                margin: 20px auto !important;
                border-radius: 0;
            }
        }
         /* Sidebar links – default text colour */
        #sidebar .nav-link {
            color: #ffffff !important;    /* white */
        }

        /* Hover / focus state */
        #sidebar .nav-link:hover,
        #sidebar .nav-link:focus {
            color: #0d6efd !important;    /* Bootstrap-blue */
            background-color: transparent;/* keep the red background you already set */
        }

        /* Optional: keep the active item blue too */
        #sidebar .nav-link.active {
            color: #0d6efd !important;
            font-weight: bold;            /* you already had this */
        }
        #current-time {
            white-space: nowrap;
        }
    </style>
</head>
<body>    
    <header>
        <div class="burger-menu">☰</div>
        <div class="header-left">
            <h1 style="margin: 0; font-size: 24px;">Appointments</h1>
        </div>
        <div class="header-right">
            <div id="current-time"></div>
            <select id="language-select" class="form-select">
                <option value="en">English</option>
                <option value="gr">Greek</option>
            </select>
        </div>
    </header>
    <div class="container-fluid">
        <nav id="sidebar">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="classes.html"><i class="bi bi-people"></i> Classes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html"><i class="bi bi-info-circle"></i> About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="pricing.html"><i class="bi bi-tag"></i> Pricing</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="users.html"><i class="bi bi-people"></i> Users</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="payments.html"><i class="bi bi-credit-card"></i> Payments</a>
                </li>
            </ul>
        </nav>
        <div class="content">
            <section>
                <h2><i class="bi bi-calendar-plus"></i> Manage Appointments</h2>
                <button type="button" class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus"></i> Add Appointment</button>
            </section>
            <section>
                <h2><i class="bi bi-calendar-event"></i> View Appointments</h2>
                <div id="appointments-list">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Notes</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appointments-table-body">
                            <!-- Appointment rows will be added here by JavaScript -->
                        </tbody>
                    </table>
                    <div class="card-container" id="appointments-card-container">
                        <!-- Appointment cards will be added here by JavaScript -->
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- The Modal for adding an appointment -->
    <div id="addAppointmentModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2><i class="bi bi-calendar-plus"></i> Add Appointment</h2>
            <form id="add-appointment-form">
                <div class="mb-3">
                    <label for="appointment-date" class="form-label"><i class="bi bi-calendar-event"></i> Date and Time:</label>
                    <input type="datetime-local" class="form-control" id="appointment-date" name="date" required>
                </div>
                <div class="mb-3">
                    <label for="appointment-name" class="form-label"><i class="bi bi-person"></i> Full Name:</label>
                    <input type="text" class="form-control" id="appointment-name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="appointment-email" class="form-label"><i class="bi bi-envelope"></i> Email:</label>
                    <input type="email" class="form-control" id="appointment-email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="appointment-phone" class="form-label"><i class="bi bi-telephone"></i> Phone:</label>
                    <input type="tel" class="form-control" id="appointment-phone" name="phone" required>
                </div>
                <div class="mb-3">
                    <label for="appointment-notes" class="form-label"><i class="bi bi-card-text"></i> Notes:</label>
                    <textarea class="form-control" id="appointment-notes" name="notes"></textarea>
                </div>
                <button type="button" class="btn btn-primary" onclick="addAppointment()"><i class="bi bi-save"></i> Add Appointment</button>
            </form>
        </div>
    </div>

    <!-- The Modal for editing an appointment -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2><i class="bi bi-pencil-square"></i> Edit Appointment</h2>
            <form id="edit-appointment-form">
                <div class="mb-3">
                    <label for="edit-appointment-date" class="form-label"><i class="bi bi-calendar-event"></i> Date and Time:</label>
                    <input type="datetime-local" class="form-control" id="edit-appointment-date" name="date" required>
                </div>
                <div class="mb-3">
                    <label for="edit-appointment-name" class="form-label"><i class="bi bi-person"></i> Full Name:</label>
                    <input type="text" class="form-control" id="edit-appointment-name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="edit-appointment-email" class="form-label"><i class="bi bi-envelope"></i> Email:</label>
                    <input type="email" class="form-control" id="edit-appointment-email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="edit-appointment-phone" class="form-label"><i class="bi bi-telephone"></i> Phone:</label>
                    <input type="tel" class="form-control" id="edit-appointment-phone" name="phone" required>
                </div>
                <div class="mb-3">
                    <label for="edit-appointment-notes" class="form-label"><i class="bi bi-card-text"></i> Notes:</label>
                    <textarea class="form-control" id="edit-appointment-notes" name="notes"></textarea>
                </div>
                <button type="button" class="btn btn-primary" onclick="saveEditedAppointment()"><i class="bi bi-save"></i> Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Sample appointment data
        let appointmentsData = [
            {
                "date": "2023-10-15",
                "time": "10:00",
                "fullName": "John Doe",
                "email": "john.doe@example.com",
                "phone": "555-1234",
                "notes": "Interested in personal training.",
                "attended": false
            },
            {
                "date": "2023-10-16",
                "time": "11:00",
                "fullName": "Jane Smith",
                "email": "jane.smith@example.com",
                "phone": "555-5678",
                "notes": "New member, needs orientation.",
                "attended": true
            },
            {
                "date": "2023-10-17",
                "time": "09:00",
                "fullName": "Mike Johnson",
                "email": "mike.johnson@example.com",
                "phone": "555-9012",
                "notes": "Follow-up on previous session.",
                "attended": false
            }
        ];

        let currentEditIndex = -1;

        // Render the appointments on page load
        document.addEventListener('DOMContentLoaded', function() {
            renderAppointments();

            document.querySelector('.burger-menu').addEventListener('click', function() {
                var sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('open');
            });

            updateTime();
            setInterval(updateTime, 1000);

            document.getElementById('language-select').addEventListener('change', function() {
                const selectedLanguage = this.value;
                alert('Language changed to ' + selectedLanguage);
            });
        });

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('current-time').textContent = timeString;
        }

        function openModal() {
            document.getElementById('addAppointmentModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('addAppointmentModal').style.display = 'none';
            document.getElementById('editModal').style.display = 'none';
        }

        // Function to render appointments
        function renderAppointments() {
            const tableBody = document.getElementById('appointments-table-body');
            const cardContainer = document.getElementById('appointments-card-container');
            tableBody.innerHTML = '';
            cardContainer.innerHTML = '';

            appointmentsData.forEach((appointment, index) => {
                // Table row for desktop view
                const row = document.createElement('tr');
                if (appointment.attended) {
                    row.classList.add('attended');
                }

                const dateCell = document.createElement('td');
                dateCell.textContent = appointment.date;
                row.appendChild(dateCell);

                const timeCell = document.createElement('td');
                timeCell.textContent = appointment.time;
                row.appendChild(timeCell);

                const nameCell = document.createElement('td');
                nameCell.textContent = appointment.fullName;
                row.appendChild(nameCell);

                const emailCell = document.createElement('td');
                emailCell.textContent = appointment.email;
                row.appendChild(emailCell);

                const phoneCell = document.createElement('td');
                phoneCell.textContent = appointment.phone;
                row.appendChild(phoneCell);

                const notesCell = document.createElement('td');
                notesCell.textContent = appointment.notes;
                row.appendChild(notesCell);

                const actionsCell = document.createElement('td');
                actionsCell.innerHTML = `
                    <button class="btn btn-warning" onclick="openEditModal(${index})"><i class="bi bi-pencil"></i> Edit</button>
                    <button class="btn btn-danger" onclick="deleteAppointment(${index})"><i class="bi bi-trash"></i> Delete</button>
                    <button class="btn btn-info" onclick="toggleAttendance(${index})">${appointment.attended ? 'Mark Absent' : 'Mark Attended'}</button>
                `;
                row.appendChild(actionsCell);

                tableBody.appendChild(row);

                // Card for mobile view
                const card = document.createElement('div');
                card.className = `card ${appointment.attended ? 'attended' : ''}`;
                card.innerHTML = `
                    <p><strong>Date:</strong> ${appointment.date}</p>
                    <p><strong>Time:</strong> ${appointment.time}</p>
                    <p><strong>Full Name:</strong> ${appointment.fullName}</p>
                    <p><strong>Email:</strong> ${appointment.email}</p>
                    <p><strong>Phone:</strong> ${appointment.phone}</p>
                    <p><strong>Notes:</strong> ${appointment.notes}</p>
                    <div class="item-actions">
                        <button class="btn btn-warning" onclick="openEditModal(${index})"><i class="bi bi-pencil"></i> Edit</button>
                        <button class="btn btn-danger" onclick="deleteAppointment(${index})"><i class="bi bi-trash"></i> Delete</button>
                        <button class="btn btn-info" onclick="toggleAttendance(${index})">${appointment.attended ? 'Mark Absent' : 'Mark Attended'}</button>
                    </div>
                `;
                cardContainer.appendChild(card);
            });
        }

        function openEditModal(index) {
            const appointment = appointmentsData[index];
            document.getElementById('edit-appointment-date').value = `${appointment.date}T${appointment.time}`;
            document.getElementById('edit-appointment-name').value = appointment.fullName;
            document.getElementById('edit-appointment-email').value = appointment.email;
            document.getElementById('edit-appointment-phone').value = appointment.phone;
            document.getElementById('edit-appointment-notes').value = appointment.notes;
            currentEditIndex = index;
            document.getElementById('editModal').style.display = 'block';
        }

        function saveEditedAppointment() {
            const dateTime = document.getElementById('edit-appointment-date').value;
            const fullName = document.getElementById('edit-appointment-name').value;
            const email = document.getElementById('edit-appointment-email').value;
            const phone = document.getElementById('edit-appointment-phone').value;
            const notes = document.getElementById('edit-appointment-notes').value;

            if (dateTime && fullName && email && phone) {
                const [date, time] = dateTime.split('T');
                appointmentsData[currentEditIndex] = { date, time, fullName, email, phone, notes, attended: appointmentsData[currentEditIndex].attended };
                renderAppointments();
                closeModal();
            }
        }

        function addAppointment() {
            const dateTime = document.getElementById('appointment-date').value;
            const fullName = document.getElementById('appointment-name').value;
            const email = document.getElementById('appointment-email').value;
            const phone = document.getElementById('appointment-phone').value;
            const notes = document.getElementById('appointment-notes').value;

            if (dateTime && fullName && email && phone) {
                const [date, time] = dateTime.split('T');
                const newAppointment = {
                    date,
                    time,
                    fullName,
                    email,
                    phone,
                    notes,
                    attended: false
                };
                appointmentsData.push(newAppointment);
                renderAppointments();
                closeModal();
                document.getElementById('add-appointment-form').reset();
            } else {
                alert('Please fill in all fields.');
            }
        }

        function deleteAppointment(index) {
            if (confirm("Are you sure you want to delete this appointment?")) {
                appointmentsData.splice(index, 1);
                renderAppointments();
            }
        }

        function toggleAttendance(index) {
            appointmentsData[index].attended = !appointmentsData[index].attended;
            renderAppointments();
        }

        // Close modal when pressing ESC key
        document.addEventListener('keydown', function(event) {
            
            if (event.key === "Escape") {
                closeModal();
            }
        });
    </script>
</body>
</html>
